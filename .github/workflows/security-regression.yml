name: Security regression (backend)
on:
  push:
    branches:
      - audit/security-hardening-2026-10
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --runInBand --watch=false
